# Deploys all Edge Functions on every push to main that touches supabase/functions (and manually via 'Run workflow') to the hosted Supabase project.
# One-time setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> add
#   SUPABASE_ACCESS_TOKEN  (Supabase dashboard -> Account -> Access Tokens -> Generate new token)
#   SUPABASE_PROJECT_REF   (mkglxcdtfimgmvxtddst)
# Function secrets (R2, NVIDIA, Gemini, ...) are NOT handled here: set them in Supabase -> Edge Functions -> Secrets.
name: Deploy Supabase Edge Functions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
# Least privilege: the job only needs to read the repo; it talks to Supabase with SUPABASE_ACCESS_TOKEN.
permissions:
  contents: read
# Never run two production deploys at once; a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # pinned (same as package.json); bump deliberately, not on every run
      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --yes: recent CLI versions ask "Deploy N Functions?" and abort with "Nothing was changed" when stdout is not a terminal (CI).
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --use-api --yes
