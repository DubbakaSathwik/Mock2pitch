<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-600)}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,7,45,.06)}.sw b{font-family:var(--font-display);font-weight:400;color:var(--text-strong);font-size:13px}code{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--prussian-blue)"></div><b>Prussian Blue</b><code>#00072D</code></div><div class="sw"><div class="chip" style="background:var(--deep-navy)"></div><b>Deep Navy</b><code>#001C55</code></div><div class="sw"><div class="chip" style="background:var(--imperial-blue)"></div><b>Imperial Blue</b><code>#0A2472</code></div><div class="sw"><div class="chip" style="background:var(--bright-marine)"></div><b>Bright Marine</b><code>#0E6BA8</code></div><div class="sw"><div class="chip" style="background:var(--icy-blue)"></div><b>Icy Blue</b><code>#A6E1FA</code></div></div></body></html>
