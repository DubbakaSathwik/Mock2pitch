<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft, friendly rounding; pills for actions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-600)}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,7,45,.06)}.sw b{font-family:var(--font-display);font-weight:400;color:var(--text-strong);font-size:13px}code{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-xs)"></div><code>xs</code></div><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-sm)"></div><code>sm</code></div><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-md)"></div><code>md</code></div><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-lg)"></div><code>lg</code></div><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-xl)"></div><code>xl</code></div><div class="sw" style="align-items:center"><div style="width:80px;height:64px;background:var(--marine-50);border:1.5px solid var(--bright-marine);border-radius:var(--radius-pill)"></div><code>pill</code></div></div></body></html>
