<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-600)}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,7,45,.06)}.sw b{font-family:var(--font-display);font-weight:400;color:var(--text-strong);font-size:13px}code{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--pitch-violet)"></div><b>Pitch Violet</b><code>#7B4DFF</code></div><div class="sw"><div class="chip" style="background:var(--pitch-violet-soft)"></div><b>Violet Soft</b><code>#EEE8FF</code></div><div class="sw" style="flex:2"><div class="chip" style="background:var(--logo-arc)"></div><b>Logo arc</b><code>#2F5BF0 → #7B4DFF</code></div></div></body></html>
