<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-600)}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,7,45,.06)}.sw b{font-family:var(--font-display);font-weight:400;color:var(--text-strong);font-size:13px}code{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div style="background:var(--bg-page);padding:20px;border-radius:12px"><div style="background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px;display:flex;flex-direction:column;gap:16px;outline:1px dashed var(--marine-200)"><div style="font-family:var(--font-display);color:var(--text-strong);font-size:19px">Timing</div><div style="display:flex;gap:8px"><span style="background:var(--success-50);color:var(--success-500);padding:4px 10px;border-radius:999px;font-size:13px">On target</span><span style="background:var(--ink-100);padding:4px 10px;border-radius:999px;font-size:13px">4:52 / 5:00</span></div></div></div></body></html>
