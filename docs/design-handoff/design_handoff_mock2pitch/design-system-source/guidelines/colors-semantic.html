<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Report states: on-track, watch, fix, info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;margin:0}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-600)}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(0,7,45,.06)}.sw b{font-family:var(--font-display);font-weight:400;color:var(--text-strong);font-size:13px}code{font-family:var(--font-mono);font-size:11px;color:var(--ink-500)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success-500)"></div><div class="chip" style="height:28px;background:var(--success-50)"></div><b>Success</b><code>--success-500 / 50</code></div><div class="sw"><div class="chip" style="background:var(--warning-500)"></div><div class="chip" style="height:28px;background:var(--warning-50)"></div><b>Warning</b><code>--warning-500 / 50</code></div><div class="sw"><div class="chip" style="background:var(--danger-500)"></div><div class="chip" style="height:28px;background:var(--danger-50)"></div><b>Danger / Record</b><code>--danger-500 / 50</code></div><div class="sw"><div class="chip" style="background:var(--info-500)"></div><div class="chip" style="height:28px;background:var(--info-50)"></div><b>Info</b><code>--info-500 / 50</code></div></div></body></html>
